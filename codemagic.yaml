version: 1

workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 60
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    environment:
      node: '20'
      java: '17'
      vars:
        # URL do backend Django (troque para IP/domínio público em produção)
        EXPO_PUBLIC_API_URL: 'http://192.168.146.9:8010/api'
    scripts:
      - name: Instalar dependências
        script: |
          cd frontend
          npm ci || npm install
      - name: Typecheck
        script: |
          cd frontend
          npx tsc --noEmit || true
      - name: Gerar projeto nativo Android (expo prebuild)
        script: |
          cd frontend
          npx expo prebuild --platform android --clean
      - name: Build APK (release)
        script: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleRelease
      - name: Renomear APK
        script: |
          APK=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -1)
          mkdir -p artifacts
          cp "$APK" artifacts/Destino-v1.0.0.apk
          ls -la artifacts/
    artifacts:
      - artifacts/Destino-v1.0.0.apk
      - frontend/android/app/build/outputs/apk/**/*.apk
